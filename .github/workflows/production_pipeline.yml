name: Convective Risk Analyst Engine Execution Pipeline

# ── SCHEDULE ────────────────────────────────────────────────────────────────
# GitHub cron is UTC-ONLY. India is UTC+5:30, so to fire at
#   01:00, 07:00, 13:00, 19:00 IST  we schedule 5h30m earlier in UTC:
#     19:30 UTC (-> 01:00 IST), 01:30 (-> 07:00), 07:30 (-> 13:00), 13:30 (-> 19:00)
# GitHub fires scheduled jobs up to ~15 min late; acceptable for a 24h-horizon product.
on:
  schedule:
    - cron: "30 19,1,7,13 * * *"
  workflow_dispatch:   # manual "Run workflow" button in the Actions UI
  push:
    branches: [main, master]
    paths:
      - "**"
      - ".github/workflows/production_pipeline.yml"

# NOTE: NO `permissions: contents: write` and NO commit step.
# This is a PUBLIC repo. The generated report names client assets (e.g. "Mumbai Hub")
# and is tactical intelligence — committing it would leak it publicly. Delivery is via
# the private Telegram channel only. The repo contains CODE, not OUTPUTS.
jobs:
  execute_forecasting_matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # App code lives at repo root now.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Codebase Ingestion
        uses: actions/checkout@v4

      - name: Python Environment Provisioning
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # requirements.txt lives in the app subdir (weather-updater/).
          cache-dependency-path: requirements.txt

      - name: Resolve System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt

      - name: Execute Local Validation Assertions
        # Real gate: sim_scenarios.py returns non-zero exit on ANY failure.
        # (Not `unittest discover` — that file is a script with a main(), not TestCases,
        #  so discover would report "0 tests" and falsely pass.)
        run: python engine/sim_scenarios.py

      - name: Retain System Validation Database
        # Persist engine/archive.db across cron runs so forecast-vs-observed
        # verification history (skill / bias calibration) is NOT lost on every
        # job restart. The DB is gitignored (*.db) so it never enters version
        # control. Key is branch-stable; restore-keys falls back to the most
        # recent prior run's cache (per-run keys would never restore).
        uses: actions/cache@v4
        with:
          path: engine/archive.db
          key: weather-db-${{ github.ref_name }}
          restore-keys: |
            weather-db-

      - name: Retain No-Key Forecast Cache
        # Persist weather-updater/cache/ (forecast_cache.json) across cron runs
        # so the 6h no-key grid+cities cache survives job restarts. Protects
        # runs 2-4 within a 6h window from re-hitting Open-Meteo's anonymous
        # daily cap (esp. on a shared Azure egress IP). Key is branch-stable;
        # restore-keys falls back to the most recent prior run's cache.
        uses: actions/cache@v4
        with:
          path: cache
          key: weather-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            weather-cache-${{ github.ref_name }}-
            weather-cache-

      - name: Run Core Weather Risk Analysis Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Dry-run (print to log, no send) unless BOTH secrets are present.
          # Safe default: a public fork without secrets will not try to post.
          DRY_RUN: ${{ (secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '') && 'false' || 'true' }}
        run: python run_report.py
